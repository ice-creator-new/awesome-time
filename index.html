<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050508" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="妙时" />
  <title>妙时 · Awesome Time</title>
  <style>
    :root {
      --bg: #050508;
      --surface: #141a1f;
      --surface2: #1c242b;
      --ink: #e6edf3;
      --muted: #8b98a5;
      --accent: #ff9f43;
      --track: #2a333b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    }
    .brand {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--accent);
      font-weight: 600;
      text-align: center;
      margin-bottom: 8px;
    }
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
    }
    .icon-wrap {
      width: min(56vw, 220px);
      aspect-ratio: 1;
      border-radius: 24%;
      overflow: hidden;
      background: var(--surface);
      box-shadow:
        0 24px 60px rgba(255, 159, 67, 0.18),
        0 8px 24px rgba(0, 0, 0, 0.55);
      position: relative;
    }
    .icon-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }
    .icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 40px);
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .en {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .tag {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      max-width: 18em;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: 18px;
      padding: 16px 18px;
      display: grid;
      gap: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
    }
    .label { color: var(--muted); }
    .value { color: var(--ink); font-weight: 600; text-align: right; }
    .swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 4px;
      margin-right: 6px;
      vertical-align: -1px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }
    .primary {
      appearance: none;
      border: 0;
      width: 100%;
      max-width: 420px;
      height: 52px;
      border-radius: 14px;
      background: var(--accent);
      color: #050508;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
    }
    .primary:active { transform: scale(0.98); opacity: 0.92; }
    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }
    @media (min-width: 720px) {
      body { justify-content: center; }
      .hero { max-width: 560px; margin: 0 auto; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="brand">妙时 · AWESOME TIME</div>

  <main class="hero">
    <div class="icon-wrap" aria-label="App icon">
      <img src="assets/icon.png" alt="妙时 App 图标" width="512" height="512" />
    </div>

    <div>
      <h1>妙时</h1>
      <p class="en">Awesome Time</p>
      <p class="tag">电脑播放，手机同步。进度、封面、频谱一体遥控。</p>
    </div>

    <section class="card" aria-label="品牌信息">
      <div class="row">
        <span class="label">应用名称</span>
        <span class="value">妙时</span>
      </div>
      <div class="row">
        <span class="label">英文名</span>
        <span class="value">Awesome Time</span>
      </div>
      <div class="row">
        <span class="label">Bundle 显示名</span>
        <span class="value">妙时</span>
      </div>
      <div class="row">
        <span class="label">主色</span>
        <span class="value"><i class="swatch" style="background:#ff9f43"></i>#FF9F43</span>
      </div>
      <div class="row">
        <span class="label">底色</span>
        <span class="value"><i class="swatch" style="background:#050508"></i>#050508</span>
      </div>
    </section>

    <button class="primary" type="button" id="installHint">使用「妙时」</button>
    <p class="note">图标与命名预览 · 可在手机浏览器 / 模拟器中打开</p>
  </main>

  <script>
    document.getElementById("installHint").addEventListener("click", () => {
      const btn = document.getElementById("installHint");
      btn.textContent = "已就绪 · 妙时";
      btn.disabled = true;
      btn.style.opacity = "0.85";
    });
  </script>
</body>
</html>
